name: Rust Audit

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Find Cargo projects
        id: check
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CARGO_DIRS=$(find . -name Cargo.toml -not -path "*/target/*" -exec dirname {} \; | sort -u | paste -sd ' ')
          if [ -z "$CARGO_DIRS" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "cargo_dirs=$CARGO_DIRS" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cargo-audit
        if: steps.check.outputs.should_run == 'true'
        run: cargo install cargo-audit

      - name: Run audit
        if: steps.check.outputs.should_run == 'true'
        run: |
          for dir in ${{ steps.check.outputs.cargo_dirs }}; do
            echo "::group::audit ($dir)"
            cargo audit -f "$dir/Cargo.lock"
            echo "::endgroup::"
          done
