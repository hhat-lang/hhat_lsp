[package]
name = "hhat_lsp_server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hhat-lsp"
path = "src/main.rs"

[dependencies]
chumsky = "1.0.0-alpha.8"
tower-lsp = "0.20"
lsp-types = "0.97"
logos = "0.15"
ropey = "1.6"
dashmap = "6"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
